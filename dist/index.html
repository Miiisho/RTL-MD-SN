<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>محرر RTL Markdown</title>
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body dir="rtl">
    <div class="toolbar" role="toolbar" aria-label="أدوات التنسيق">
      <button type="button" data-action="bold" title="عريض (Ctrl+B)" aria-label="عريض">
        <svg viewBox="0 0 24 24"><path d="M6 4h7a4 4 0 0 1 0 8H6z"/><path d="M6 12h8a4 4 0 0 1 0 8H6z"/></svg>
      </button>
      <button type="button" data-action="italic" title="مائل (Ctrl+I)" aria-label="مائل">
        <svg viewBox="0 0 24 24"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg>
      </button>
      <button type="button" data-action="underline" title="تحته خط (Ctrl+U)" aria-label="تحته خط">
        <svg viewBox="0 0 24 24"><path d="M6 3v7a6 6 0 0 0 12 0V3"/><line x1="4" y1="21" x2="20" y2="21"/></svg>
      </button>
      <button type="button" data-action="strike" title="شطب النص" aria-label="شطب">
        <svg viewBox="0 0 24 24"><line x1="4" y1="12" x2="20" y2="12"/><path d="M16 6.5A4 3 0 0 0 12 4h-1a3 3 0 0 0-1 5.8"/><path d="M8.5 17A4 3 0 0 0 13 20h1a3 3 0 0 0 1-.2"/></svg>
      </button>

      <span class="sep" aria-hidden="true"></span>

      <button type="button" data-action="h1" title="عنوان أول (قابل للطيّ)" aria-label="عنوان أول">
        <span class="txt">H<sub>1</sub></span>
      </button>
      <button type="button" data-action="h2" title="عنوان ثانٍ (قابل للطيّ)" aria-label="عنوان ثانٍ">
        <span class="txt">H<sub>2</sub></span>
      </button>
      <button type="button" data-action="h3" title="عنوان ثالث (قابل للطيّ)" aria-label="عنوان ثالث">
        <span class="txt">H<sub>3</sub></span>
      </button>

      <span class="sep" aria-hidden="true"></span>

      <button type="button" data-action="bullet" title="قائمة نقطية (النقاط)" aria-label="نقاط">
        <svg viewBox="0 0 24 24"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="4.5" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="4.5" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="4.5" cy="18" r="1.3" fill="currentColor" stroke="none"/></svg>
      </button>
      <button type="button" data-action="ordered" title="قائمة مرقّمة (الترقيم)" aria-label="ترقيم">
        <svg viewBox="0 0 24 24"><line x1="10" y1="6" x2="20" y2="6"/><line x1="10" y1="12" x2="20" y2="12"/><line x1="10" y1="18" x2="20" y2="18"/><text x="2.5" y="8.5" font-size="7" fill="currentColor" stroke="none" font-family="sans-serif">1</text><text x="2.5" y="20.5" font-size="7" fill="currentColor" stroke="none" font-family="sans-serif">2</text></svg>
      </button>
      <button type="button" data-action="task" title="قائمة مهام (To-Do)" aria-label="قائمة مهام">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="7" rx="1.5"/><polyline points="4.5 7.5 6 9 9 5.5"/><line x1="13" y1="6" x2="20" y2="6"/><line x1="13" y1="12" x2="20" y2="12"/><line x1="13" y1="18" x2="20" y2="18"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>
      </button>

      <span class="sep" aria-hidden="true"></span>

      <button type="button" data-action="divider" title="مقسّم الصفحات" aria-label="مقسم الصفحات">
        <svg viewBox="0 0 24 24"><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="7" x2="9" y2="7"/><line x1="15" y1="7" x2="20" y2="7"/><line x1="4" y1="17" x2="9" y2="17"/><line x1="15" y1="17" x2="20" y2="17"/></svg>
      </button>
      <button type="button" data-action="code" title="كود" aria-label="كود">
        <svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
      </button>
      <button type="button" data-action="table" title="إدراج جدول" aria-label="جدول">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1.5"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="4" x2="9" y2="20"/><line x1="15" y1="4" x2="15" y2="20"/></svg>
      </button>
      <button type="button" data-action="dir" title="تبديل اتجاه الفقرة (RTL/LTR)" aria-label="تبديل الاتجاه">
        <svg viewBox="0 0 24 24"><polyline points="8 6 4 10 8 14"/><polyline points="16 6 20 10 16 14"/><line x1="4" y1="10" x2="20" y2="10"/><line x1="7" y1="19" x2="17" y2="19"/></svg>
      </button>
      <button type="button" data-action="align-right" title="محاذاة يمين" aria-label="محاذاة يمين">
        <svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="6" y1="18" x2="20" y2="18"/></svg>
      </button>
      <button type="button" data-action="align-center" title="توسيط" aria-label="توسيط">
        <svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="5" y1="18" x2="19" y2="18"/></svg>
      </button>
      <button type="button" data-action="align-left" title="محاذاة يسار" aria-label="محاذاة يسار">
        <svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="15" y2="12"/><line x1="4" y1="18" x2="18" y2="18"/></svg>
      </button>

      <span class="sep" aria-hidden="true"></span>

      <button type="button" data-action="undo" title="تراجع (العودة للوراء)" aria-label="تراجع">
        <svg viewBox="0 0 24 24"><polyline points="9 14 4 9 9 4"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/></svg>
      </button>
      <button type="button" data-action="redo" title="إعادة" aria-label="إعادة">
        <svg viewBox="0 0 24 24"><polyline points="15 14 20 9 15 4"/><path d="M20 9H9a5 5 0 0 0 0 10h1"/></svg>
      </button>

      <span class="spacer"></span>
      <div class="font-size" role="group" aria-label="مقاس الخط">
        <button type="button" data-action="font-smaller" title="تصغير الخط" aria-label="تصغير"><span class="txt">A−</span></button>
        <input id="font-size-input" type="number" min="12" max="40" title="مقاس الخط" aria-label="مقاس الخط" />
        <button type="button" data-action="font-bigger" title="تكبير الخط" aria-label="تكبير"><span class="txt">A＋</span></button>
      </div>
      <select id="font-select" class="font-select" title="نوع الخط" aria-label="نوع الخط">
        <option value="cairo">عصري (Cairo)</option>
        <option value="sans">حديث</option>
        <option value="serif">نسخ</option>
        <option value="alt">أنيق</option>
        <option value="mono">ثابت العرض</option>
      </select>
      <button type="button" id="toggle-source" title="إظهار مصدر Markdown" aria-label="مصدر Markdown">
        <svg viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
      </button>
    </div>

    <div class="workspace">
      <div
        id="editor"
        class="editor"
        contenteditable="true"
        dir="rtl"
        spellcheck="true"
        role="textbox"
        aria-multiline="true"
        aria-label="محرر النص"
      ></div>
      <textarea
        id="source"
        class="source"
        dir="rtl"
        spellcheck="false"
        aria-label="مصدر Markdown"
      ></textarea>
    </div>

    <div id="table-tools" class="table-tools" role="toolbar" aria-label="التحكم بالجدول">
      <button type="button" data-tt="add-row" title="إضافة صف">＋ صف</button>
      <button type="button" data-tt="add-col" title="إضافة عمود">＋ عمود</button>
      <button type="button" data-tt="del-row" title="حذف صف">－ صف</button>
      <button type="button" data-tt="del-col" title="حذف عمود">－ عمود</button>
      <button type="button" data-tt="center" title="توسيط الجدول">توسيط</button>
      <button type="button" data-tt="widen" title="توسيع لكامل العرض">توسيع</button>
      <button type="button" data-tt="del-table" title="حذف الجدول" class="danger">🗑</button>
    </div>

    <div id="table-popover" class="popover" role="dialog" aria-label="إدراج جدول">
      <div class="pop-title">إدراج جدول</div>
      <div class="pop-row">
        <label>صفوف <input id="table-rows" type="number" min="1" max="20" value="2" /></label>
        <label>أعمدة <input id="table-cols" type="number" min="1" max="10" value="2" /></label>
      </div>
      <div class="pop-row">
        <span class="pop-label">العنوان:</span>
        <button type="button" class="pop-choice sel" data-header="row">صف علوي</button>
        <button type="button" class="pop-choice" data-header="column">عمود جانبي</button>
      </div>
      <div class="pop-actions">
        <button type="button" id="table-close" class="pop-btn ghost">إلغاء</button>
        <button type="button" id="table-insert" class="pop-btn primary">إدراج</button>
      </div>
    </div>

    <script src="editor.js"></script>
  </body>
</html>
