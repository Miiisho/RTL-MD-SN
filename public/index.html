<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>محرر RTL Markdown</title>
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body dir="rtl">
    <div class="toolbar" role="toolbar" aria-label="أدوات التنسيق">
      <button type="button" data-action="bold" title="عريض (Ctrl+B)" aria-label="عريض">
        <svg viewBox="0 0 24 24"><path d="M6 4h7a4 4 0 0 1 0 8H6z"/><path d="M6 12h8a4 4 0 0 1 0 8H6z"/></svg>
      </button>
      <button type="button" data-action="italic" title="مائل (Ctrl+I)" aria-label="مائل">
        <svg viewBox="0 0 24 24"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg>
      </button>
      <button type="button" data-action="underline" title="تحته خط (Ctrl+U)" aria-label="تحته خط">
        <svg viewBox="0 0 24 24"><path d="M6 3v7a6 6 0 0 0 12 0V3"/><line x1="4" y1="21" x2="20" y2="21"/></svg>
      </button>

      <span class="sep" aria-hidden="true"></span>

      <button type="button" data-action="bullet" title="قائمة نقطية (النقاط)" aria-label="نقاط">
        <svg viewBox="0 0 24 24"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="4.5" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="4.5" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="4.5" cy="18" r="1.3" fill="currentColor" stroke="none"/></svg>
      </button>
      <button type="button" data-action="ordered" title="قائمة مرقّمة (الترقيم)" aria-label="ترقيم">
        <svg viewBox="0 0 24 24"><line x1="10" y1="6" x2="20" y2="6"/><line x1="10" y1="12" x2="20" y2="12"/><line x1="10" y1="18" x2="20" y2="18"/><text x="2.5" y="8.5" font-size="7" fill="currentColor" stroke="none" font-family="sans-serif">1</text><text x="2.5" y="20.5" font-size="7" fill="currentColor" stroke="none" font-family="sans-serif">2</text></svg>
      </button>

      <span class="sep" aria-hidden="true"></span>

      <button type="button" data-action="divider" title="مقسّم الصفحات" aria-label="مقسم الصفحات">
        <svg viewBox="0 0 24 24"><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="7" x2="9" y2="7"/><line x1="15" y1="7" x2="20" y2="7"/><line x1="4" y1="17" x2="9" y2="17"/><line x1="15" y1="17" x2="20" y2="17"/></svg>
      </button>
      <button type="button" data-action="code" title="كود" aria-label="كود">
        <svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
      </button>

      <span class="sep" aria-hidden="true"></span>

      <button type="button" data-action="undo" title="تراجع (العودة للوراء)" aria-label="تراجع">
        <svg viewBox="0 0 24 24"><polyline points="9 14 4 9 9 4"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/></svg>
      </button>

      <span class="spacer"></span>
      <button type="button" id="toggle-preview" title="إظهار/إخفاء المعاينة" aria-label="معاينة">
        <svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>

    <div class="workspace">
      <textarea
        id="editor"
        dir="rtl"
        spellcheck="true"
        placeholder="اكتب ملاحظتك هنا بصيغة Markdown..."
      ></textarea>
      <div id="preview" class="preview" dir="rtl" aria-live="polite"></div>
    </div>

    <div id="status" class="status" aria-live="polite"></div>

    <script src="editor.js"></script>
  </body>
</html>
